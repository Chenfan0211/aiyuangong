<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>审批与审计中心｜武汉狮子座店</title>
  <style>
    :root{--bg:#eef2f7;--paper:#fff;--ink:#172033;--muted:#667085;--line:#dfe5ee;--blue:#3157d5;--green:#067647;--red:#b42318;--amber:#b54708;--shadow:0 18px 50px rgba(16,24,40,.1)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .wrap{width:min(1160px,calc(100% - 28px));margin:14px auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;background:linear-gradient(135deg,#0b1429,#1b3a6b);color:#fff}
    header h1{font-size:18px;margin:0}header small{display:block;color:#a9c2e0;font-size:11px;letter-spacing:.12em}
    header .who{font-size:12px;color:#d7e5ff;text-align:right}a.btn,button{border:0;border-radius:9px;padding:7px 12px;font:inherit;cursor:pointer}
    a.btn{background:rgba(255,255,255,.14);color:#fff;text-decoration:none;font-size:12px}
    main{padding:18px 22px 26px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
    select,input{border:1px solid #cfd6e3;border-radius:9px;padding:6px 9px;font:inherit}
    .ghost{background:#fff;border:1px solid #cfd8ea;color:#344054}.ghost:hover{border-color:var(--blue);color:var(--blue)}
    h2{font-size:15px;margin:20px 0 10px;display:flex;align-items:center;gap:8px}h2 span{font-size:12px;color:var(--muted);font-weight:400}
    table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
    th{color:var(--muted);font-weight:600;background:#fbfcfe}.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px}
    .tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:999px;background:#eef2f7;color:#475467}
    .tag.pending{background:#fff1cc;color:#93370d}.tag.approved,.tag.success{background:#dcfae6;color:#05603a}
    .tag.rejected,.tag.failed,.tag.blocked{background:#fee4e2;color:#b42318}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
    .card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcfe;display:flex;flex-direction:column;gap:8px}
    .card .t{font-weight:600}.card .s{font-size:11px;color:var(--muted)}.card .acts{display:flex;gap:6px;margin-top:auto}
    .ok{background:var(--green);color:#fff}.no{background:#fff;border:1px solid #f4b4ae;color:var(--red)}
    .empty{color:var(--muted);font-size:12px;padding:10px 0}.notice{margin:10px 0;padding:10px 12px;border-radius:10px;background:#fff1cc;color:#93370d;font-size:12px}
    @media(max-width:760px){header{padding:12px 14px;flex-direction:column;align-items:flex-start}main{padding:14px}.cards{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div><small>GOVERNANCE CENTER</small><h1>审批与审计中心</h1></div>
    <div class="who"><div id="who">未登录</div><a class="btn" href="/dashboard">经营看板</a> <a class="btn" href="/agent.html">返回对话 →</a></div>
  </header>
  <main>
    <div id="notice" class="notice" hidden></div>
    <div class="toolbar">
      <select id="statusFilter"><option value="pending">待审批</option><option value="approved">已通过</option><option value="rejected">已驳回</option><option value="">全部</option></select>
      <button class="ghost" id="refresh">刷新审批</button>
      <span id="counts" class="tag">—</span>
    </div>

    <h2>审批队列 <span id="queueHint">通过后任务转为「可执行」，驳回后转为「已驳回」；驳回必须填写原因</span></h2>
    <div class="cards" id="queue"><div class="empty">加载中…</div></div>

    <h2>审计流水 <span>谁在何时看了什么、改了什么（含登录失败与越权尝试）</span></h2>
    <div class="toolbar">
      <select id="eventType"><option value="">全部事件</option></select>
      <input id="actorFilter" placeholder="按操作者过滤，例如 manager01" />
      <button class="ghost" id="refreshAudit">刷新审计</button>
      <span class="tag" id="auditSummary">—</span>
    </div>
    <table><thead><tr><th>时间</th><th>事件</th><th>操作者</th><th>对象</th><th>详情</th></tr></thead><tbody id="auditBody"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody></table>

    <h2>工具调用留痕 <span>Agent 每次读取数据的记录（入参出参已脱敏）</span></h2>
    <table><thead><tr><th>时间</th><th>工具</th><th>操作者</th><th>会话</th><th>状态</th><th>入参</th></tr></thead><tbody id="toolBody"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody></table>
  </main>
</div>
<script>
  const token=localStorage.getItem('store-agent-token')||'';
  const $=id=>document.getElementById(id);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function notice(text,isError){const el=$('notice');if(!text){el.hidden=true;return}el.hidden=false;el.textContent=text;el.style.background=isError?'#fee4e2':'#fff1cc';el.style.color=isError?'#b42318':'#93370d'}
  async function api(path,options){const opts=options||{};opts.headers=opts.headers||{};if(token)opts.headers['Authorization']='Bearer '+token;const r=await fetch(path,opts);const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||data.detail||('HTTP '+r.status));return data}
  async function post(path,body){return api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
  const fmtTime=v=>esc(v).slice(0,19).replace('T',' ');
  const tagOf=s=>`<span class="tag ${esc(s)}">${esc(s)}</span>`;

  async function loadQueue(){
    try{
      const data=await api('/api/approvals?status='+encodeURIComponent($('statusFilter').value));
      $('who').textContent=(data.store_id||'')+' · '+(data.approvals.length)+' 条';
      $('counts').textContent=Object.entries(data.count_by_status||{}).map(([k,v])=>k+' '+v).join(' / ')||'无审批单';
      const box=$('queue');box.innerHTML='';
      if(!(data.approvals||[]).length){box.innerHTML='<div class="empty">该状态下没有审批单。</div>';return}
      data.approvals.forEach(a=>{
        const card=document.createElement('div');card.className='card';
        const payload=JSON.stringify(a.payload_snapshot||{});
        card.innerHTML=`<div class="t">${esc((a.payload_snapshot||{}).title||a.action_type)}</div>
          <div>${tagOf(a.status)}<span class="tag">${esc(a.action_type)}</span></div>
          <div class="s">申请人 ${esc(a.requested_by)} · ${fmtTime(a.requested_at)}${a.task_id?' · 任务 '+esc(a.task_id):''}</div>
          <div class="s mono">${esc(payload).slice(0,160)}</div>`;
        if(a.status==='pending'){
          const acts=document.createElement('div');acts.className='acts';
          const ok=document.createElement('button');ok.className='ok';ok.textContent='通过';ok.onclick=()=>decide(a,'approved');
          const no=document.createElement('button');no.className='no';no.textContent='驳回';no.onclick=()=>decide(a,'rejected');
          acts.append(ok,no);card.appendChild(acts);
        }
        box.appendChild(card);
      });
    }catch(error){notice('审批队列读取失败：'+error.message,true);$('queue').innerHTML='<div class="empty">读取失败</div>'}
  }
  async function decide(approval,decision){
    let reason='';
    if(decision==='rejected'){reason=window.prompt('驳回原因（必填）：')||'';if(!reason){notice('驳回必须填写原因',true);return}}
    else{reason=window.prompt('通过备注（可留空）：')||''}
    try{await post('/api/approvals/'+encodeURIComponent(approval.approval_id)+'/decide',{decision,reason});notice('已'+(decision==='approved'?'通过':'驳回')+'：'+(approval.payload_snapshot&&approval.payload_snapshot.title||approval.action_type),false);loadQueue();loadAudit()}
    catch(error){notice('审批失败：'+error.message,true)}
  }
  async function loadAudit(){
    try{
      const params=new URLSearchParams({limit:'50'});
      if($('eventType').value)params.set('event_type',$('eventType').value);
      if($('actorFilter').value.trim())params.set('actor_id',$('actorFilter').value.trim());
      const data=await api('/api/audit?'+params.toString());
      const s=data.summary||{};
      $('auditSummary').textContent=`近 ${s.days} 天 ${s.total} 条 · 越权 ${s.permission_denied} · 登录失败 ${s.login_failed}`;
      const select=$('eventType');
      if(select.options.length<=1){(data.event_types||[]).forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;select.appendChild(o)})}
      const body=$('auditBody');body.innerHTML='';
      if(!(data.events||[]).length){body.innerHTML='<tr><td colspan="5" class="empty">没有匹配的审计事件。</td></tr>';return}
      data.events.forEach(e=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td class="mono">${fmtTime(e.created_at)}</td><td>${tagOf(e.event_type)}</td>
          <td class="mono">${esc(e.actor_id)}</td><td class="mono">${esc(e.object_type)}#${esc(e.object_id).slice(0,40)}</td>
          <td class="mono">${esc(JSON.stringify(e.after||e.before||{})).slice(0,110)}</td>`;
        body.appendChild(tr);
      });
    }catch(error){notice('审计读取失败：'+error.message,true);$('auditBody').innerHTML='<tr><td colspan="5" class="empty">读取失败（可能缺少 audit:read 权限）</td></tr>'}
  }
  async function loadToolRuns(){
    try{
      const data=await api('/api/tool-runs?limit=30');
      const body=$('toolBody');body.innerHTML='';
      if(!(data.runs||[]).length){body.innerHTML='<tr><td colspan="6" class="empty">暂无工具调用记录。</td></tr>';return}
      data.runs.forEach(r=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td class="mono">${fmtTime(r.created_at)}</td><td>${esc(r.tool_name)}</td>
          <td class="mono">${esc(r.actor_id)}</td><td class="mono">${esc(r.session_id||'-')}</td>
          <td>${tagOf(r.status)}</td><td class="mono">${esc(JSON.stringify(r.input_redacted||{})).slice(0,80)}</td>`;
        body.appendChild(tr);
      });
    }catch(error){$('toolBody').innerHTML='<tr><td colspan="6" class="empty">读取失败（需要 audit:read 权限）</td></tr>'}
  }
  $('refresh').onclick=loadQueue;$('refreshAudit').onclick=loadAudit;
  $('statusFilter').onchange=loadQueue;$('eventType').onchange=loadAudit;
  if(!token){notice('未登录：请先在对话页面登录，再回到本页。',true)}
  else{notice('');loadQueue();loadAudit();loadToolRuns()}
</script>
</body>
</html>
