services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mall_ops}
      POSTGRES_USER: ${POSTGRES_USER:-mall_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mall_ops} -d ${POSTGRES_DB:-mall_ops}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      STORE_AGENT_ENV: production
      STORE_AGENT_MFA_ENFORCE: "1"
      STORE_AGENT_METRICS_DB: postgresql://${POSTGRES_USER:-mall_ops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mall_ops}
      STORE_AGENT_STORE_DB: postgresql://${POSTGRES_USER:-mall_ops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mall_ops}
      STORE_AGENT_CHAT_DB: postgresql://${POSTGRES_USER:-mall_ops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mall_ops}
    volumes:
      - evidence_data:/app/evidence
      - imports_inbox:/app/imports/inbox
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  backup:
    build: .
    profiles: ["ops"]
    restart: "no"
    env_file: .env.production
    environment:
      STORE_AGENT_ENV: production
      STORE_AGENT_STORE_DB: postgresql://${POSTGRES_USER:-mall_ops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mall_ops}
      STORE_AGENT_BACKUP_STORAGE: ${STORE_AGENT_BACKUP_STORAGE:-local}
      STORE_AGENT_BACKUP_LOCAL_ROOT: /app/data/backups
      BACKUP_ENCRYPTION_KEY_FILE: /app/data/backups/.backup-key
    volumes:
      - backup_data:/app/data
      - evidence_data:/app/evidence:ro
      - ./store_config.json:/app/store_config.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    command: ["sh", "scripts/backup.sh"]


  ops:
    build: .
    profiles: ["ops"]
    restart: "no"
    env_file: .env.production
    environment:
      STORE_AGENT_ENV: production
      STORE_AGENT_METRICS_DB: postgresql://${POSTGRES_USER:-mall_ops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mall_ops}
      STORE_AGENT_STORE_DB: postgresql://${POSTGRES_USER:-mall_ops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mall_ops}
      STORE_AGENT_CHAT_DB: postgresql://${POSTGRES_USER:-mall_ops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mall_ops}
      STORE_AGENT_BASE_URL: ${STORE_AGENT_BASE_URL:?STORE_AGENT_BASE_URL is required}
      STORE_AGENT_BACKUP_STORAGE: ${STORE_AGENT_BACKUP_STORAGE:-local}
      STORE_AGENT_BACKUP_LOCAL_ROOT: /app/data/backups
      STORE_AGENT_EVIDENCE_DIR: /app/evidence
      STORE_AGENT_IMPORT_INBOX: /app/imports/inbox
      STORE_AGENT_OPS_LOCK: /app/data/ops/daily_sync.lock
      BACKUP_ENCRYPTION_KEY_FILE: /app/data/backups/.backup-key
    volumes:
      - backup_data:/app/data
      - evidence_data:/app/evidence:ro
      - imports_inbox:/app/imports/inbox:ro
      - ./store_config.json:/app/store_config.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    command: ["python", "scripts/daily_sync.py"]

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  evidence_data:
  imports_inbox:
  backup_data:
  caddy_data:
  caddy_config:
