services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mall_ops}
      POSTGRES_USER: ${POSTGRES_USER:-mall_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mall_ops} -d ${POSTGRES_DB:-mall_ops}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      STORE_AGENT_ENV: production
      STORE_AGENT_METRICS_DB: postgresql://${POSTGRES_USER:-mall_ops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mall_ops}
      STORE_AGENT_STORE_DB: postgresql://${POSTGRES_USER:-mall_ops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mall_ops}
      STORE_AGENT_CHAT_DB: postgresql://${POSTGRES_USER:-mall_ops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mall_ops}
    volumes:
      - evidence_data:/app/evidence
      - imports_inbox:/app/imports/inbox
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  evidence_data:
  imports_inbox:
  caddy_data:
  caddy_config:
